# RSNA Knee Abnormality Detection — Default Configuration
# Based on research/project_plan.md

# --- Paths ---
data:
  root: "/kaggle/input/rsna-knee-abnormality-detection"
  train_csv: "train.csv"
  train_series_csv: "train_series.csv"
  test_series_csv: "test_series.csv"
  train_dicom_dir: "train_series"
  test_dicom_dir: "test_series"
  reports_col: "Report"

# --- Labels (12 targets) ---
labels:
  - "ACL"
  - "MCL"
  - "Medial_Meniscus"
  - "Lateral_Meniscus"
  - "Medial_OA"
  - "Lateral_OA"
  - "PF_OA"
  - "Effusion"
  - "Synovitis"
  - "Bakers"
  - "Contusion"
  - "Fracture"

# --- Data pipeline ---
data_pipeline:
  target_size: [384, 384]           # H, W resample target
  slice_max: 40                     # max slices per series (truncate tail)
  normalization: "sequence_type"    # per-sequence-type windowing
  num_workers: 4
  pin_memory: true

# --- Views ---
views:
  - "Sagittal"
  - "Coronal"
  - "Axial"

# --- Model backbone ---
backbone:
  name: "convnext_small"            # convnext_small in phase 1
  pretrained: true
  out_dim: 768                      # embedding dimension
  # DINOv2 will be trained separately for ensemble
  # dinov2_vitb14 out_dim=768

# --- 2.5D input ---
input_25d:
  enabled: true
  num_slices: 3                     # 3 adjacent slices as channels

# --- Attention MIL pooling ---
mil_pooling:
  type: "gated_attention"           # Ilse et al. gated attention
  per_label: true                   # per-label attention weights
  hidden_dim: 256

# --- Cross-view fusion ---
fusion:
  type: "transformer"
  num_layers: 2
  num_heads: 8
  dim: 768
  dropout: 0.1
  missing_view_token: true          # learned token for absent views

# --- Label-attention decoder (ML-Decoder) ---
decoder:
  type: "label_attention"
  num_layers: 1
  num_heads: 8
  dim: 768
  dropout: 0.1

# --- Contrastive pretraining ---
contrastive:
  text_encoder: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
  loss: "infonce"
  temperature: 0.07
  batch_size: 16
  epochs: 10
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  use_grad_cache: false             # for small GPU memory
  grad_cache_chunk: 4

# --- Supervised fine-tuning ---
training:
  batch_size: 4                     # small for GTX 960 / Kaggle T4
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 3
  scheduler: "cosine"
  optimizer: "adamw"
  mixed_precision: true             # AMP
  gradient_clip: 1.0
  seed: 42
  early_stopping_patience: 7
  loss: "bce"                       # bce or focal
  focal_alpha: 0.25
  focal_gamma: 2.0

# --- Cross-validation ---
cv:
  n_folds: 5
  strategy: "group_kfold"           # grouped by StudyInstanceUID
  iterative_stratification: true    # scikit-multilearn for multi-label
  check_per_fold_positives: true

# --- Ensemble ---
ensemble:
  models:
    - "convnext_small"
    - "dinov2_vitb14"
  blend: "average"                  # average or rank_average
  calibrate: true                   # Platt scaling before blend

# --- Efficiency Track ---
efficiency:
  profile_inference: true
  target_inference_per_study_ms: 5000  # 5s per study target
  single_backbone_fallback: "convnext_small"

# --- Experiment tracking ---
experiment:
  log_dir: "experiments"
  log_file: "experiments/experiment_log.md"
